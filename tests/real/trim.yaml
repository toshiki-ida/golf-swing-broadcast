# フレーム番号は元素材のもの。HFR 2x (29.97fps 記録) は 1 秒 = 120 フレーム、59.94p は 60 フレーム。
# address_est / finish_est は 0.25 秒刻みのサムネイル目視による概算 (±30 フレーム程度)。
# 終盤に選手の顔へズームする素材は、ズーム開始の手前で終わらせる (zoom_cut: true)。
# 切り出しは tools/trim_real.py → tests/real/trimmed/<名前>_trim.mp4 (git 管理外)。
# 評価 (tools/eval_club.py --all) と正解ラベルは切り出し後のファイルに対して行う。

